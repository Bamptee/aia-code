<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIA - AI Architecture Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'aia-bg': '#0f172a',
            'aia-card': '#1e293b',
            'aia-border': '#334155',
            'aia-accent': '#38bdf8',
          }
        }
      }
    }
  </script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19?dev",
      "react-dom/client": "https://esm.sh/react-dom@19/client?dev",
      "react/jsx-runtime": "https://esm.sh/react@19/jsx-runtime?dev"
    }
  }
  </script>
  <style>
    body { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace; }
    .step-done { @apply bg-emerald-500/20 text-emerald-400 border-emerald-500/30; }
    .step-pending { @apply bg-slate-700/50 text-slate-400 border-slate-600; }
    .step-in-progress { @apply bg-amber-500/20 text-amber-400 border-amber-500/30; }
    .step-error { @apply bg-red-500/20 text-red-400 border-red-500/30; }
    textarea { tab-size: 2; }

    /* Type badges */
    .type-feature { @apply bg-emerald-500/20 text-emerald-400 border-emerald-500/30; }
    .type-bug { @apply bg-red-500/20 text-red-400 border-red-500/30; }

    /* App chips */
    .app-chip { @apply bg-slate-700/50 text-slate-300 border border-slate-600 px-2 py-0.5 text-xs rounded-full; }
    .app-chip-selected { @apply bg-aia-accent/20 text-aia-accent border border-aia-accent/30 px-2 py-0.5 text-xs rounded-full; }

    /* Modal animations */
    .modal-step-enter { opacity: 0; transform: translateX(20px); }
    .modal-step-active { opacity: 1; transform: translateX(0); transition: all 0.2s ease-out; }
    .modal-step-exit { opacity: 0; transform: translateX(-20px); }

    /* Epic & Story statuses */
    .status-draft { @apply bg-slate-500/20 text-slate-300 border-slate-500/30; }
    .status-active { @apply bg-sky-500/20 text-sky-300 border-sky-500/30; }
    .status-done { @apply bg-emerald-500/20 text-emerald-300 border-emerald-500/30; }
    .status-ready_for_dev { @apply bg-violet-500/20 text-violet-300 border-violet-500/30; }
    .status-in_progress { @apply bg-sky-500/20 text-sky-300 border-sky-500/30; }
    .status-testing { @apply bg-amber-500/20 text-amber-300 border-amber-500/30; }

    /* Space badges */
    .space-experimentation { @apply bg-amber-500/20 text-amber-300 border-amber-500/30; }
    .space-development { @apply bg-emerald-500/20 text-emerald-300 border-emerald-500/30; }

    /* Drag and drop */
    .drop-target { @apply ring-2 ring-aia-accent ring-offset-2 ring-offset-slate-900; }
    .dragging { @apply opacity-50 cursor-grabbing; }

    /* Progress bars */
    .progress-bar { @apply bg-slate-700 rounded-full overflow-hidden; }
    .progress-fill { @apply bg-aia-accent h-full transition-all duration-300; }

    /* Line clamp utility */
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .line-clamp-3 {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-aia-bg text-slate-200 min-h-screen">
  <div id="root"></div>
  <script type="module" src="/main.js"></script>
</body>
</html>
